name: Test and Lint

on:
  push:
  pull_request:

jobs:
  gate-evidence-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate gate evidence artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          artifact_path = Path(".copilot/gate-evidence.json")
          if not artifact_path.is_file():
              raise SystemExit(f"Missing required artifact: {artifact_path}")

          try:
              data = json.loads(artifact_path.read_text(encoding="utf-8"))
          except json.JSONDecodeError as exc:
              raise SystemExit(f"Invalid JSON in {artifact_path}: {exc}") from exc

          required = {
              "schemaVersion": int,
              "gate": str,
              "status": str,
              "evidence": list,
          }
          missing = [key for key in required if key not in data]
          if missing:
              raise SystemExit(f"Missing required keys in {artifact_path}: {missing}")

          for key, expected_type in required.items():
              if not isinstance(data[key], expected_type):
                  raise SystemExit(
                      f"Invalid type for '{key}' in {artifact_path}: expected {expected_type.__name__}"
                  )

          if data["status"] not in {"pass", "fail"}:
              raise SystemExit("Invalid status in .copilot/gate-evidence.json: expected 'pass' or 'fail'")
          PY

  test-lint:
    needs: gate-evidence-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Run release readiness checks
        run: npm run release:readiness
